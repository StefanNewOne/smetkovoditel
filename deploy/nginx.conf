# Nginx reverse proxy + TLS for the Finance OS (SM-7). Replace <domain> at go-live.
# TLS certs are issued by Certbot into ./deploy/certbot/conf (see _docs/deployment/production.md).

# HTTP → HTTPS redirect (and ACME challenge passthrough).
server {
    listen 80;
    server_name <domain>;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name <domain>;

    ssl_certificate     /etc/letsencrypt/live/<domain>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<domain>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Camera photo uploads (W6) — keep in step with next.config serverActions bodySizeLimit.
    client_max_body_size 8m;

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
